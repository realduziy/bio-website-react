services:
  website-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website_test
    env_file:
      - .env
    ports:
      # Map host port 8000 (or whichever you proxy to from your VPS Nginx)
      # to container port 3000 where our Express server listens.
      - "127.0.0.1:8000:3000"
      # Alternatively, to bind to all interfaces on port 8000:
      # - "0.0.0.0:8000:3000"
    restart: always
    volumes:
      # OPTIONAL BUT HIGHLY RECOMMENDED:
      # Map direct VPS asset paths to your container to persist data across container restarts and builds
      # Maps local 'assets' folder on host machine to the container's '/app/assets' folder.
      - ./assets:/app/assets
